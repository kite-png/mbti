<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>나의 식물 MBTI 알아보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sunflower:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --cream:#F7F4EC; --paper:#FFFFFF; --ink:#242018; --ink-soft:#5C574C;
    --sage:#5C6B4F; --sage-deep:#3D4934; --sage-pale:#E4E9DC;
    --clay:#B4622F; --clay-deep:#8F4B22; --clay-pale:#F3E1D2;
    --line:#DDD6C4; --radius-lg:18px; --radius-md:14px; --radius-sm:8px;
    --shadow:0 4px 20px rgba(61,73,52,0.08);
    --vh:100dvh;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; overscroll-behavior:none; }
  body{
    background:var(--cream); color:var(--ink);
    font-family:'Sunflower', sans-serif; font-weight:500;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h3,.serif{ font-family:'Sunflower', sans-serif; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }

  .screen{ display:none; height:var(--vh); flex-direction:column; max-width:520px; margin:0 auto; padding:0 22px; }
  .screen.active{ display:flex; }

  .topbar{ flex:0 0 auto; display:flex; align-items:center; justify-content:flex-end; padding:16px 0 10px; }
  #screen-landing .topbar{ justify-content:center; padding:22px 0 8px; min-height:52px; }
  .brand-logo{ position:fixed; top:22px; left:50%; transform:translateX(-50%); z-index:10; display:block; width:min(39%, 140px); height:auto; }
  #screen-survey .topbar{ padding-top:52px; }
  .step-count{ font-size:13px; color:var(--ink-soft); font-weight:500; }

  .scroll-area{ flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; }

  .btn-primary{ display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; background:var(--clay); color:#FFF; font-size:16px; font-weight:700; border:none; border-radius:var(--radius-sm); }
  #screen-landing .btn-primary{ width:calc(100% - 10px); min-height:43px; margin:0 auto; border-radius:999px; }
  #screen-landing .btn-primary{ font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:20px; }
  .btn-primary:active{ background:var(--clay-deep); }
  .btn-secondary{ display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; background:transparent; color:var(--sage-deep); font-size:15px; font-weight:700; border:1.5px solid var(--sage-deep); border-radius:var(--radius-sm); }
  .nav-row .btn-secondary{ min-height:43px; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

  /* LANDING */
  #screen-landing .scroll-area{ justify-content:center; align-items:stretch; gap:4vh; }
  .hero-illust{ width:76.8%; max-width:252px; margin:0 auto; }
  .hero-illust img{ width:100%; }
  .hero-illust svg{ display:none; }
  .hero h1, #screen-landing h1{ font-size:clamp(24px, 7vw, 32px); font-weight:700; color:var(--sage-deep); line-height:1.3; text-align:center; }
  .hero .lede, .lede{ font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:400; font-size:clamp(14px, 4vw, 16px); color:var(--ink-soft); text-align:center; max-width:360px; margin:0 auto; line-height:1.5; }
  .meta-row{ display:flex; gap:10px; justify-content:center; padding:10px 0; }
  .meta-item{ text-align:center; }
  .meta-item .num{ font-size:19px; font-weight:700; color:var(--sage-deep); display:block; }
  .meta-item .lab{ font-size:11px; color:var(--ink-soft); }
  .cta-block{ flex:0 0 auto; padding:10px 0 clamp(16px, 4vh, 28px); }
  .cta-note{ text-align:center; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight:400; font-size:12px; color:#aaaaaa; margin-top:10px; }

  /* SURVEY */
  .progress-track{ flex:0 0 auto; width:100%; height:5px; background:var(--sage-pale); border-radius:6px; overflow:hidden; margin-bottom:6px; }
  .progress-fill{ height:100%; background:var(--sage-deep); border-radius:6px; transition:width .35s ease; }
  #screen-survey .scroll-area{ justify-content:safe center; gap:3vh; }
  .question-illust{ display:block; flex:0 0 auto; width:76.8%; max-width:252px; height:auto; margin:0 auto; }
  .q-text{ white-space:pre-line; font-size:clamp(25px, 7.3vw, 30px); font-weight:500; color:var(--ink); line-height:1.45; text-align:center; }
  .choice-list{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  /* 선택지 영역은 Pretendard 고정 */
  .choice-card{ display:flex; align-items:center; justify-content:center; text-align:center; padding:9px 11px; border:1.5px solid var(--line); border-radius:999px; background:var(--paper); width:calc(100% - 10px);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  .choice-card .txt{ font-family:inherit; font-weight:400; font-size:14.5px; color:var(--ink); line-height:1.5; }
  .choice-card:active{ border-color:var(--sage-deep); background:var(--sage-pale); }
  .nav-row{ flex:0 0 auto; display:flex; justify-content:center; gap:10px; padding:12px 0 clamp(14px, 3vh, 24px); }
  .nav-row .btn-secondary{ flex:0 0 88px; border-radius:999px; }

  /* RESULT */
  .result-screen{ justify-content:space-between; gap:20px; overflow-y:auto; padding:56px 20px 20px; background:var(--cream); color:var(--ink); }
  .result-content{ display:flex; flex:1 0 auto; flex-direction:column; justify-content:center; gap:12px; }
  .result-plant-image{ display:block; width:min(70%, 250px); height:clamp(150px, 26vh, 220px); margin:0 auto 4px; object-fit:contain; }
  #result-mbti{ text-align:center; color:var(--clay); font-size:clamp(30px, 8vw, 38px); font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
  .result-description{ padding:16px; border:1px solid var(--line); border-radius:16px; background:var(--paper); color:var(--ink); font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:14px; line-height:1.65; box-shadow:var(--shadow); }
  .result-description p + p{ margin-top:8px; }
  .result-description [hidden]{ display:none; }
  .result-plant{ padding-top:4px; text-align:center; }
  .result-plant-label{ color:var(--clay); font-size:12px; font-weight:700; letter-spacing:.08em; }
  #result-name{ margin-top:4px; color:var(--ink); font-size:clamp(22px, 6vw, 28px); font-weight:900; }
  .result-actions{ display:flex; flex-direction:column; gap:10px; padding-top:12px; }
  .result-link, .result-action-button{ display:block; width:calc(100% - 10px); margin:0 auto; padding:14px 11px; border-radius:999px; text-align:center; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size:15px; font-weight:700; transition:background .2s, transform .2s; }
  .result-link{ border:1px solid var(--clay-deep); background:var(--clay); color:#fff; box-shadow:var(--shadow); }
  .result-link:hover{ background:var(--clay-deep); }
  .result-button-row{ display:flex; }
  .result-action-button{ flex:1; border:1px solid var(--clay); color:#fff; }
  .result-action-button:active{ transform:scale(.95); }
  .result-restart{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line); box-shadow:var(--shadow); }
  .result-restart:hover{ background:var(--sage-pale); }

  @media (max-height:700px){
    .result-screen{ padding-top:56px; }
    .result-description{ padding:12px 14px; }
    .brand-logo{ width:min(33%, 120px); }
  }
</style>
</head>

const questionIllustrations = Array.from({length: 8}, (_, index) =>
  `${String(index + 2).padStart(2, "0")}.png`
);

let current = 0;
const answers = new Array(questions.length).fill(null);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startSurvey(){
  current = 0;
  answers.fill(null);
  showScreen('screen-survey');
  renderQuestion();
}

function renderQuestion(){
  const item = questions[current];
  document.getElementById('questionIllust').src = questionIllustrations[current];
  document.getElementById('qText').textContent = item.q;
  document.getElementById('stepLabel').textContent = (current+1)+' / '+questions.length;
  document.getElementById('progressFill').style.width = (((current+1)/questions.length)*100)+'%';
  
  const list = document.getElementById('choiceList');
  list.innerHTML = '';
  ['a','b'].forEach(key=>{
    const opt = item[key];
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'choice-card';
    card.innerHTML = `<span class="txt">${opt.text}</span>`;
    card.onclick = ()=>{ answers[current] = key; goNext(); };
    list.appendChild(card);
  });
}

function goPrev(){
  if(current>0){ current--; renderQuestion(); }
  else { showScreen('screen-landing'); }
}

function goNext(){
  if(current < questions.length-1){
    current++;
    renderQuestion();
  } else {
    finishSurvey();
  }
}

function finishSurvey(){
  const scores = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 };
  questions.forEach((item,i)=>{
    const picked = item[answers[i]];
    scores[picked.type] += picked.score;
  });
  const code =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.S >= scores.N ? 'S' : 'N') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  renderResult(code);
  showScreen('screen-result');
}

function renderResult(type){
  if(!DATA[type]) type = "ISTJ";
  const d = DATA[type];

  const plantImage = document.getElementById("result-plant-image");
  plantImage.src = `${type}.png`;
  plantImage.alt = `${type} MBTI 결과 이미지`;
  document.getElementById("result-mbti").textContent = type;
  [1, 2, 3].forEach((index)=>{
    const description = document.getElementById(`result-desc-${index}`);
    const text = d.desc[index - 1];
    description.hidden = !text;
    description.textContent = text ? `• ${text}` : "";
  });

  document.getElementById("result-name").textContent = d.plants[0].name;
  document.getElementById("result-link").href = "types/" + type.toLowerCase() + ".html";
}

function restartTest(){
  current = 0;
  answers.fill(null);
  showScreen("screen-landing");
}
